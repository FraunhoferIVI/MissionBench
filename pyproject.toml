[project]
name = "missionbench"
version = "0.1.0"
description = "MissionBench – UAV Mission Planning & VLM Evaluation"
readme = "README.md"
requires-python = ">=3.10,<3.11"

# Shared / lightweight dependencies used by both envs
dependencies = [
    "numpy>=2.2.6",
    "pillow>=12.1.0",
    "pyyaml>=6.0.2",
    "opencv-python>=4.10.0.84",
    "matplotlib>=3.9.2",
    "imageio[ffmpeg]>=2.36.0",
    "requests>=2.32.5",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
# ── AirSim API server environment ──────────────────────────────────
server = [
    "cosysairsim==3.3.0",
    "rpc-msgpack>=0.6",
    "tornado>=6.5,<7",
    "gymnasium>=0.29.0",
    "flask>=3.1.2",
    "psutils>=3.3.11",
    "puremagic>=1.30",
    "pypdf>=6.7.0",
]

# ── MissionBench experiment / ML environment ───────────────────────
missionbench = [
    # Data & analysis
    "pandas>=2.3.2",
    "plotly>=6.3.0",
    "scipy>=1.15.3",
    "shapely==2.1.2",
    "python-dotenv>=1.0.1",
    "pytest>=9.0.2",
    # LLM stack
    "openai>=1.108.2",
    "langchain-anthropic>=0.3.20",
    "langchain-aws>=0.2.0",
    "langchain-experimental>=0.3.4",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.3.7",
    "langgraph-supervisor>=0.0.4",
    "langgraph-swarm>=0.0.3",
    # Notebooks & reporting
    "jupyter>=1.1.1",
    "notebook>=7.3.2",
    "pdfplumber>=0.11.5",
    "google-api-python-client>=2.167.0",
    "google-auth>=2.39.0",
    "google-auth-oauthlib>=1.2.0",
    # Serving / APIs
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.32.0,<0.33",
    "sse-starlette>=2.2.0",
    "sseclient-py>=1.8.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28.0,<0.29",
    # ML
    "torch>=2.2.0",
    "torchvision>=0.15.1",
    "transformers>=5.2.0",
    "trl>=0.29.0",
    "peft>=0.18.1",
    "faiss-cpu>=1.10.0",
    "grandalf>=0.8",
]

# ── Everything ─────────────────────────────────────────────────────
all = [
    "missionbench[server,missionbench]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"